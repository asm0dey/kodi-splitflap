[mutmut]
source_paths=screensaver.splitflap/resources/lib/
# The bundled-phrase tests read a data file that mutmut does not copy into its
# mutated tree, and they exercise content rather than logic, so they cannot
# kill a mutant anyway.
runner=python -m pytest -x -q --no-header -p no:cacheprovider --deselect tests/test_bundled_phrases.py
